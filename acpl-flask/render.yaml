services:
  - type: web
    name: acpl-financial-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@acpl.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acpl-postgres
          property: connectionString

databases:
  - name: acpl-postgres
    plan: free
